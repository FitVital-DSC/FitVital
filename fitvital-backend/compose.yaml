services:
  postgres:
    image: postgres:17
    container_name: fitvital-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitvital_user
      POSTGRES_PASSWORD: fitvital_dev_password
      POSTGRES_DB: fitvital_db
    ports:
      - "5432:5432"
    volumes:
      - fitvital_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitvital_user -d fitvital_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitvital_postgres_data: